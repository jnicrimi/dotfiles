commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-commit:
  parallel: true
  jobs:
    - name: gitleaks
      run: gitleaks git --pre-commit --staged
    - name: biome
      run: pnpm exec biome check --staged --no-errors-on-unmatched
    - name: markdownlint
      glob: "*.md"
      run: pnpm exec markdownlint-cli2 {staged_files}
    - name: yamllint
      glob: "*.{yml,yaml}"
      run: mise run yamllint --strict {staged_files}
    - name: actionlint
      glob: ".github/workflows/*.{yml,yaml}"
      run: actionlint {staged_files}
    - name: zizmor
      glob: ".github/workflows/*.{yml,yaml}"
      run: zizmor --persona=pedantic --offline {staged_files}
    - name: taplo
      glob: "*.toml"
      run: taplo fmt --check {staged_files}
    - name: fish
      glob: "**/*.fish"
      run: for f in {staged_files}; do fish -n "$f" || exit 1; done
    - name: fish_indent
      glob: "**/*.fish"
      run: fish_indent --check {staged_files}
    - name: shellcheck
      glob: "**/*.sh"
      run: shellcheck {staged_files}
    - name: selene
      glob: "**/*.lua"
      run: selene {staged_files}
    - name: stylua
      glob: "**/*.lua"
      run: stylua --check {staged_files}

pre-push:
  jobs:
    - name: gitleaks
      run: gitleaks git --log-opts "origin/main..HEAD"
